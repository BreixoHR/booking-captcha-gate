name: tests

on:
  push:
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:10
      - name: Lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit
        run: phpunit
      - name: Smoke test
        run: php tests/smoke/plugin-smoke.php
